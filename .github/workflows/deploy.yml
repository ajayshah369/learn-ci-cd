name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: learn-ci-cd

permissions:
  id-token: write # REQUIRED for OIDC — without it, no token is minted
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci

  build:
    name: Build and push image
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Work out the image URI
        id: meta
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          docker build \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            -t ${{ steps.meta.outputs.image }} .
          docker push ${{ steps.meta.outputs.image }}

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and swap the container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ needs.build.outputs.image }}
            docker pull ${{ needs.build.outputs.image }}
            docker stop api || true
            docker rm api || true
            docker run -d --name api \
              -p 3000:3000 \
              --restart unless-stopped \
              -e NODE_ENV=production \
              -e GIT_COMMIT=${{ github.sha }} \
              ${{ needs.build.outputs.image }}
            docker image prune -af --filter "until=168h"

  verify:
    name: Smoke test
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Check /health reports the new commit
        run: |
          sleep 10
          RESPONSE=$(curl -fsS http://${{ secrets.EC2_HOST }}/health)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q "${{ github.sha }}" \
            || (echo "Deployed commit does not match!" && exit 1)
